    <circle cx="362" cy="222" r="92" fill="#FFAFC3"/>
    <circle cx="362" cy="222" r="92" fill="none" stroke="#C56F88" stroke-width="4" opacity="0.35"/>
    <ellipse cx="335" cy="196" rx="30" ry="22" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Matcha pearl (bottom) -->
  <g>
    <circle cx="262" cy="368" r="92" fill="#A5D791"/>
    <circle cx="262" cy="368" r="92" fill="none" stroke="#4A6741" stroke-width="4" opacity="0.35"/>
