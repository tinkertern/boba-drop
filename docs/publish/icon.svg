<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid-fill version. ImageMagick MSVG doesn't resolve <radialGradient> so
       we use flat fills + one small white circle highlight per pearl for gloss. -->

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5D5A5"/>
  <!-- Background corner accents to break up the flat field -->
  <circle cx="80" cy="80" r="120" fill="#FFE9CC" opacity="0.6"/>
  <circle cx="944" cy="944" r="100" fill="#FFE9CC" opacity="0.5"/>

  <!-- Soft drop shadow under cup -->
  <ellipse cx="512" cy="930" rx="320" ry="34" fill="#5C3A21" opacity="0.18"/>

  <!-- Cup body (rounded trapezoidal, wider at top, classic takeaway cup) -->
  <path d="M 252 256
           L 304 884
           Q 308 920 348 920
           L 676 920
           Q 716 920 720 884
           L 772 256
           Z"
        fill="#FFF6E4"
        stroke="#5C3A21"
        stroke-width="18"
        stroke-linejoin="round"/>

  <!-- Cup rim band -->
  <line x1="262" y1="286" x2="762" y2="286" stroke="#5C3A21" stroke-width="6" stroke-linecap="round" opacity="0.30"/>

  <!-- Pearls inside cup (3 cols × 4 rows for legibility) -->
  <g id="pearls">
    <!-- Row 1 (bottom) -->
    <circle cx="380" cy="840" r="54" fill="#8E5E36"/>
    <circle cx="492" cy="840" r="54" fill="#A8D4A0"/>
    <circle cx="604" cy="840" r="54" fill="#F0AAAA"/>

    <!-- Row 2 -->
    <circle cx="380" cy="720" r="54" fill="#F0AAAA"/>
    <circle cx="492" cy="720" r="54" fill="#FDF6EA"/>
    <circle cx="604" cy="720" r="54" fill="#8E5E36"/>

    <!-- Row 3 -->
    <circle cx="380" cy="600" r="54" fill="#A8D4A0"/>
    <circle cx="492" cy="600" r="54" fill="#8E5E36"/>
    <circle cx="604" cy="600" r="54" fill="#F0AAAA"/>

    <!-- Row 4 (near top) -->
    <circle cx="380" cy="480" r="54" fill="#8E5E36"/>
    <circle cx="492" cy="480" r="54" fill="#A8D4A0"/>
    <circle cx="604" cy="480" r="54" fill="#FDF6EA"/>

    <!-- Glossy highlights (top-left arc on each pearl) -->
    <circle cx="364" cy="824" r="14" fill="#FFFFFF" opacity="0.60"/>
    <circle cx="476" cy="824" r="14" fill="#FFFFFF" opacity="0.60"/>
    <circle cx="588" cy="824" r="14" fill="#FFFFFF" opacity="0.60"/>
    <circle cx="364" cy="704" r="14" fill="#FFFFFF" opacity="0.60"/>
    <circle cx="476" cy="704" r="14" fill="#FFFFFF" opacity="0.60"/>
    <circle cx="588" cy="704" r="14" fill="#FFFFFF" opacity="0.60"/>
    <circle cx="364" cy="584" r="14" fill="#FFFFFF" opacity="0.60"/>
    <circle cx="476" cy="584" r="14" fill="#FFFFFF" opacity="0.60"/>
    <circle cx="588" cy="584" r="14" fill="#FFFFFF" opacity="0.60"/>
    <circle cx="364" cy="464" r="14" fill="#FFFFFF" opacity="0.60"/>
    <circle cx="476" cy="464" r="14" fill="#FFFFFF" opacity="0.60"/>
    <circle cx="588" cy="464" r="14" fill="#FFFFFF" opacity="0.60"/>
  </g>

  <!-- Overflowing/dropping pearls above the cup -->
  <g id="dropping">
    <circle cx="320" cy="190" r="50" fill="#F0AAAA" stroke="#5C3A21" stroke-width="6"/>
    <circle cx="304" cy="172" r="13" fill="#FFFFFF" opacity="0.70"/>

    <circle cx="450" cy="120" r="58" fill="#8E5E36" stroke="#5C3A21" stroke-width="6"/>
    <circle cx="432" cy="100" r="15" fill="#FFFFFF" opacity="0.70"/>

    <circle cx="580" cy="140" r="54" fill="#A8D4A0" stroke="#5C3A21" stroke-width="6"/>
    <circle cx="562" cy="120" r="14" fill="#FFFFFF" opacity="0.70"/>

    <circle cx="710" cy="200" r="48" fill="#FDF6EA" stroke="#5C3A21" stroke-width="6"/>
    <circle cx="694" cy="184" r="13" fill="#FFFFFF" opacity="0.70"/>
  </g>

  <!-- Motion lines (drop streaks under floating pearls) -->
  <line x1="450" y1="186" x2="450" y2="240" stroke="#5C3A21" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
  <line x1="580" y1="200" x2="580" y2="245" stroke="#5C3A21" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
</svg>
